
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffb6c1, #ff69b4, #c71585);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    overflow: hidden;
}

.container {
    text-align: center;
    width: 100%;
    z-index: 2;
}

h1 {
    color: white;
    margin-bottom: 35px;
    font-size: 28px;
    text-shadow: 2px 2px 5px #b03060;
}

.envelope {
    position: relative;
    width: 280px;
    height: 180px;
    background: #ffdae5;
    margin: auto;
    cursor: pointer;
    border-radius: 5px;
    box-shadow: 0 10px 30px #8b2252;
    transition: transform 0.4s;
}

.envelope:hover {
    transform: translateY(-8px);
}

.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 110px solid #ff8fab;
    transform-origin: top;
    transition: transform 0.8s;
    z-index: 3;
}

.heart {
    position: absolute;
    font-size: 35px;
    top: 65px;
    left: 122px;
    z-index: 4;
}

.open .flap {
    transform: rotateX(180deg);
}

.open .heart {
    display: none;
}

.hint {
    color: white;
    margin-top: 30px;
    font-size: 17px;
}

button {
    margin-top: 25px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #fff0f5;
    color: #d63384;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: white;
    transform: scale(1.05);
}

/* LÁ THƯ */

.letter {
    position: fixed;
    width: min(90vw, 560px);
    height: min(78vh, 720px);
    left: 50%;
    top: 50%;
    background: #fffaf0;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 50px rgba(80, 0, 40, 0.4);

    transform: translate(-50%, -45%) scale(0.7);
    opacity: 0;
    pointer-events: none;

    transition: all 0.9s ease;
    z-index: 10;
    overflow-y: auto;
    text-align: left;
}

.letter.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
}

.letter h2 {
    text-align: center;
    color: #e75480;
    font-size: 28px;
    margin-bottom: 25px;
}

.letter p {
    color: #74334b;
    font-size: 17px;
    line-height: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.signature {
    text-align: right;
    color: #d63384;
    font-size: 19px;
    margin-top: 30px;
    line-height: 2;
}

.big-heart {
    text-align: center;
    font-size: 55px;
    margin: 20px 0;
    animation: beat 1s infinite;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

.close-btn {
    display: block;
    margin: 25px auto 0;
    background: #ff80ab;
    color: white;
}

.letter::-webkit-scrollbar {
    width: 6px;
}

.letter::-webkit-scrollbar-thumb {
    background: #ff8fab;
    border-radius: 10px;
}

.letter::-webkit-scrollbar-track {
    background: #fff0f5;
}

/* TRÁI TIM BAY */

.floating-heart {
    position: fixed;
    bottom: -30px;
    color: #fff0f5;
    animation: fly 6s linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes fly {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@media(max-width: 500px) {
    .letter {
        padding: 22px;
        height: 80vh;
    }

    .letter p {
        font-size: 15px;
    }

    .letter h2 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>💗 A LETTER FOR YOU 💗</h1>

    <div class="envelope" id="envelope"
         onclick="openLetter()">

        <div class="flap"></div>
        <div class="heart">❤️</div>

    </div>

    <p class="hint" id="hint">
        💌 Nhấn vào phong thư để mở nhé!
    </p>

    <button onclick="openLetter()">
        OPEN MY LETTER 💗
    </button>

</div>

<!-- NỘI DUNG LÁ THƯ -->

<div class="letter" id="letter">

    <h2>💌 Dear You ❤️</h2>

    <p id="message"></p>

    <div class="signature">
        From: Someone who likes you
        <br>
        With love ❤️
    </div>

    <div class="big-heart">💗</div>

    <button class="close-btn" onclick="closeLetter()">
        ĐÓNG LÁ THƯ ❤️
    </button>

</div>

<script>

// =================================
// THAY NỘI DUNG LỜI TỎ TÌNH Ở ĐÂY
// =================================

const loveMessage = `
Chào cậu, Yến.
Có một điều tớ muốn nói với cậu từ lâu...

Tớ cũng không biết bắt đầu từ đâu,
Cậu còn nhớ năm lớp 7 chứ,
Khi đó tớ đã có một cảm xúc rung đọng trước cậu rồi
Nhưng mà tớ ngĩ nó chỉ là một cảm xúc vu vơ mà thôi
Tơs đã cố gắng quên đi nhưng hình ảnh cuar cậu
luôn ở trong tâm trí tớ

Cảm ơn cậu vì đã xuất hiện và những 
ngày tháng ngây thơ vô tư, vô vụ lợi
nhất của tớ và khiến những ngày bình thường
trở nên đặc biệt hơn.

Tớ xin lỗi vì đã không thể gặp trực tiếp cậu để nói ra điều này,
Tớ muốn nói rằng .....

TỚ THÍCH CẬU! ❤️

Cậu đồng ý cho tớ một lần được đứng bên cạnh cậu nhé!


From: Từ Duy-người yêu cậu bằng cả tái tim 💌


❤️❤️❤️

`;

// =================================
// HIỆU ỨNG MỞ THƯ
// =================================

let opened = false;
let typingTimer;

function openLetter() {

    if (opened) return;

    opened = true;

    document.getElementById("envelope")
        .classList.add("open");

    document.getElementById("hint")
        .innerText = "Một bức thư dành riêng cho cậu ❤️";

    const letter = document.getElementById("letter");
    const message = document.getElementById("message");

    letter.classList.add("show");

    message.textContent = "";

    let i = 0;

    function typeWriter() {

        if (i < loveMessage.length) {

            message.textContent += loveMessage.charAt(i);

            i++;

            letter.scrollTop = letter.scrollHeight;

            typingTimer = setTimeout(typeWriter, 35);
        }

    }

    setTimeout(typeWriter, 1000);
}

// =================================
// ĐÓNG THƯ
// =================================

function closeLetter() {

    clearTimeout(typingTimer);

    document.getElementById("letter")
        .classList.remove("show");

    document.getElementById("envelope")
        .classList.remove("open");

    document.getElementById("hint")
        .innerText = "💌 Nhấn vào phong thư để mở nhé!";

    document.getElementById("message").textContent = "";

    opened = false;
}

// =================================
// TRÁI TIM BAY
// =================================

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";
    heart.innerHTML = "♥";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 400);

</script>

</body>
</html>
